name: SI v0.21 AxiomFlow data and ML interoperability
on:
  push:
    paths:
      - 'versions/v0.21/**'
      - '.github/workflows/ci-v021.yml'
  pull_request:
    paths:
      - 'versions/v0.21/**'
      - '.github/workflows/ci-v021.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check syntax and runtime
        working-directory: versions/v0.21
        run: python --version && node --version && python -m compileall -q si tests axiomflow benchmarks tools && node --check js/portable.js && node --check js/vm.js && node --check js/numeric_probe.js && node --check web/app.js
      - name: Complete unit and HTTP/data/model tests
        working-directory: versions/v0.21
        run: python -W error -m unittest discover -s tests -v
      - name: Typed AxiomFlow data model CLI
        working-directory: versions/v0.21
        run: python -m axiomflow.data data/landed_cost.csv
      - name: Repeatable source packaging
        working-directory: versions/v0.21
        run: python -m tools.package_source --output /tmp/axiomflow-v021.zip
      - name: Typed project and legacy CLI/obligations
        working-directory: versions/v0.21
        run: python -m axiomflow --project project/axiomflow.json && python -m si examples.si && python -W error -m si.obligations
      - name: Explicitly non-cost-equivalent feature microbenchmark
        working-directory: versions/v0.21
        run: python benchmarks/compare_features.py --iterations 100 --repeats 3
