name: SI v0.20 AxiomFlow local HTTP and browser app
on:
  push:
    paths:
      - 'versions/v0.20/**'
      - '.github/workflows/ci-v020.yml'
  pull_request:
    paths:
      - 'versions/v0.20/**'
      - '.github/workflows/ci-v020.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check runtime and source syntax
        working-directory: versions/v0.20
        run: python --version && node --version && python -m compileall -q si tests axiomflow benchmarks && node --check js/portable.js && node --check js/vm.js && node --check js/numeric_probe.js && node --check web/app.js
      - name: Run complete SI, AxiomFlow and HTTP integration tests
        working-directory: versions/v0.20
        run: python -W error -m unittest discover -s tests -v
      - name: Pinned project CLI smoke
        working-directory: versions/v0.20
        run: python -m axiomflow --project project/axiomflow.json
      - name: Original SI CLI and bounded lexical properties
        working-directory: versions/v0.20
        run: python -m si examples.si && python -W error -m si.obligations
      - name: Repeat controlled benchmark telemetry
        working-directory: versions/v0.20
        run: python benchmarks/compare_decimal.py --iterations 100 --repeats 3
