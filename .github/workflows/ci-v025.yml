name: SI v0.25 unified CLI and independent relational source conformance
on:
  push:
    paths:
      - 'versions/v0.25/**'
      - '.github/workflows/ci-v025.yml'
  pull_request:
    paths:
      - 'versions/v0.25/**'
      - '.github/workflows/ci-v025.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Source and independent JS syntax
        working-directory: versions/v0.25
        run: python --version && node --version && python -m compileall -q si tests axiomflow tools benchmarks && node --check js/relational_runtime.js && node --check js/table_reference.js && node --check js/fixed_cents.js && node --check web/app.js
      - name: Full SI and AxiomFlow tests including cross-source runtime
        working-directory: versions/v0.25
        run: python -W error -m unittest discover -s tests -v
      - name: Unified scalar and table CLI examples
        working-directory: versions/v0.25
        run: python -m axiomflow.unified examples/filtered_table.af --csv data/landed_cost.csv && python -m axiomflow.unified example.af
      - name: Deterministic release ZIP
        working-directory: versions/v0.25
        run: python -m tools.package_source --output /tmp/axiomflow-v025.zip
      - name: Legacy SI obligations
        working-directory: versions/v0.25
        run: python -m axiomflow --project project/axiomflow.json && python -m si examples.si && python -W error -m si.obligations
      - name: Output-equivalent Python vs Node batch-process benchmark
        working-directory: versions/v0.25
        run: python benchmarks/unified_relational.py
