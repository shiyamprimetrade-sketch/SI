name: SI v0.17 AxiomFlow alpha interpreter
on:
  push:
    paths:
      - 'versions/v0.17/**'
      - '.github/workflows/ci-v017.yml'
  pull_request:
    paths:
      - 'versions/v0.17/**'
      - '.github/workflows/ci-v017.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Syntax and version
        run: python --version && node --version && python -m compileall -q versions/v0.17
      - name: Full inherited and AxiomFlow tests
        working-directory: versions/v0.17
        run: python -W error -m unittest discover -s tests -v
      - name: Execute AxiomFlow example
        working-directory: versions/v0.17
        run: python -m axiomflow example.af
      - name: Run limited exploratory benchmark
        working-directory: versions/v0.17
        run: python benchmarks/compare_decimal.py --iterations 100 --repeats 3
      - name: Retained SI lexical checks
        working-directory: versions/v0.17
        run: python -W error -m si.obligations
