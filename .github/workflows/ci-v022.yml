name: SI v0.22 typed immutable tables and compiled feature parity
on:
  push:
    paths:
      - 'versions/v0.22/**'
      - '.github/workflows/ci-v022.yml'
  pull_request:
    paths:
      - 'versions/v0.22/**'
      - '.github/workflows/ci-v022.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12','3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Language syntax validation
        working-directory: versions/v0.22
        run: python --version && node --version && python -m compileall -q si tests axiomflow tools benchmarks && node --check js/fixed_cents.js && node --check js/portable.js && node --check js/vm.js && node --check js/numeric_probe.js && node --check web/app.js
      - name: Complete regression with typed tables and independent cents oracle
        working-directory: versions/v0.22
        run: python -W error -m unittest discover -s tests -v
      - name: Data/ML CLI and source release
        working-directory: versions/v0.22
        run: python -m axiomflow.data data/landed_cost.csv && python -m tools.package_source --output /tmp/axiomflow-v022.zip
      - name: Legacy SI language obligations and pinned AxiomFlow CLI
        working-directory: versions/v0.22
        run: python -m axiomflow --project project/axiomflow.json && python -m si examples.si && python -W error -m si.obligations
      - name: Comparable-path telemetry; not language speed superiority
        working-directory: versions/v0.22
        run: python benchmarks/compare_precompiled.py --iterations 200 --repeats 3
