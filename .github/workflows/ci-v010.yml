name: SI v0.10 portable lexer and conformance
on:
  push:
    paths:
      - 'versions/v0.10/**'
      - '.github/workflows/ci-v010.yml'
  pull_request:
    paths:
      - 'versions/v0.10/**'
      - '.github/workflows/ci-v010.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    defaults:
      run:
        working-directory: versions/v0.10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax-compile language and tests
        run: python -m compileall -q si tests
      - name: Run complete SI v0.10 tests
        run: python -W error -m unittest discover -s tests -v
      - name: Execute bounded lexical obligations
        run: python -W error -m si.obligations
      - name: Run the SI language CLI sample
        run: python -m si examples.si