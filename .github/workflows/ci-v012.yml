name: SI v0.12 independent Node VM conformance
on:
  push:
    paths:
      - 'versions/v0.12/**'
      - '.github/workflows/ci-v012.yml'
  pull_request:
    paths:
      - 'versions/v0.12/**'
      - '.github/workflows/ci-v012.yml'
permissions:
  contents: read
jobs:
  cross-runtime:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check versions and syntax
        working-directory: versions/v0.12
        run: python --version && node --version && python -m compileall -q si tests && node --check js/portable.js && node --check js/vm.js
      - name: Full regression and four-engine differential tests
        working-directory: versions/v0.12
        run: python -W error -m unittest discover -s tests -v
      - name: Run inherited bounded lexical obligations
        working-directory: versions/v0.12
        run: python -W error -m si.obligations
      - name: Run original language CLI
        working-directory: versions/v0.12
        run: python -m si examples.si
