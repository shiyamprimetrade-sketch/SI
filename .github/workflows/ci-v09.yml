name: SI v0.9 operational semantics conformance
on:
  push:
    paths:
      - 'versions/v0.9/**'
      - '.github/workflows/ci-v09.yml'
  pull_request:
    paths:
      - 'versions/v0.9/**'
      - '.github/workflows/ci-v09.yml'
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        working-directory: versions/v0.9
        run: python -m compileall -q si tests
      - name: Run full SI v0.9 conformance and regression suite
        working-directory: versions/v0.9
        run: python -W error -m unittest discover -s tests -v
      - name: Run language CLI example
        working-directory: versions/v0.9
        run: python -m si examples.si